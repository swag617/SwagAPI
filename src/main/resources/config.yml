database:
  type: sqlite
  sqlite:
    file: swagapi.db
  mysql:
    host: localhost
    port: 3306
    database: swagapi
    username: root
    password: ""
    pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    use-ssl: false

economy:
  enabled: true

messaging:
  prefix: "&8[&bSwagAPI&8] &r"
  date-format: "MM/dd/yyyy HH:mm"

player-data:
  cache-expiry-minutes: 10
  auto-save-interval-minutes: 5

event-bus:
  log-events: false

debug: false

updates:
  enabled: true
  # URL of the JSON manifest listing plugin versions, download URLs, and checksums.
  # Expected format: { "PluginName": { "version": "1.2.3", "url": "https://...", "checksum": "<sha256>" }, ... }
  manifest-url: "https://raw.githubusercontent.com/swag617/swag-versions/main/versions.json"
  # How often to poll the manifest for new versions (in hours).
  check-interval-hours: 6
  # Notify online admins (swagapi.admin permission) about available updates on join.
  notify-on-join: true
  # Run an update check automatically 2 seconds after server startup.
  auto-check-on-startup: true
  # Chat prefix used in update notification messages.
  prefix: "&8[&bSwagAPI&8] &r"

network:
  # Shared secret for server-to-server API calls between Swag plugins across your network
  # (e.g. a hub server reading another server's player stats via /swagnet/<plugin>/...).
  # Must be identical on every server that should trust each other. Leave blank (the
  # default) to disable ALL /swagnet/ routes — they fail closed, not open, so an unset
  # secret never accidentally leaves them unauthenticated.
  shared-secret: ""

web-server:
  # Set to false to disable the shared HTTP web server entirely.
  enabled: true
  # TCP port the server listens on. Change if 8080 conflicts with another service.
  port: 8080
  # Bind address. Use 0.0.0.0 to listen on all interfaces, or a specific IP to restrict access.
  bind-address: "0.0.0.0"
  # The host/IP shown in every link the web panel generates (/swagapi web, module links,
  # account setup and password reset links). Leave blank to auto-detect, which picks the
  # server's LAN IP (e.g. 10.x.x.x/192.168.x.x) — fine for admins on the same LAN as the
  # server, but wrong for anyone connecting from outside it. Set this to the server's actual
  # reachable hostname or public IP (and make sure the port above is forwarded/open) so
  # non-LAN admins get a link that actually works for them.
  public-address: ""
  # Number of threads in the HTTP handler pool. Increase under heavy API load. Raised from the
  # original default of 8 — this pool is now shared across a dozen+ plugins' dashboard modules
  # (each registers its own via registerModule), several of which block their handling thread
  # while waiting on an async DB query to finish (up to a few seconds each) rather than
  # responding asynchronously. With only 8 threads total for the whole shared server, a handful
  # of concurrent slow requests across DIFFERENT plugins' dashboards could exhaust the pool and
  # make every OTHER module's dashboard appear to hang/"go down" too, even though nothing
  # actually crashed. 24 gives real headroom without material added memory cost for what's
  # still a lightweight embedded HTTP server.
  threads: 24
  auth:
    # Set to false to disable login (not recommended on publicly exposed ports).
    enabled: true
    # How many days a login session lasts. Each page visit slides the window forward.
    session-days: 30
    # How many minutes an in-game account-setup link stays valid before expiring.
    setup-token-minutes: 15
    # When true, OPs (swagapi.web permission) with no linked web panel account get a
    # clickable in-game chat prompt on join to create one via the browser.
    remind-ops-on-join: true
