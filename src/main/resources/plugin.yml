name: SwagAPI
version: '${project.version}'
api-version: "1.21"
main: com.SwagDev.SwagAPI.SwagAPI
author: Swag617
description: Shared API and communication backbone for all Swag plugins.
prefix: SwagAPI

commands:
  swagapi:
    description: SwagAPI admin command
    usage: /swagapi <reload|status|info|updatecheck|update|updates|web>
    permission: swagapi.admin
    aliases: [sapi]
  webeditor:
    description: Jump straight to the web dashboard or any registered plugin's web editor
    usage: /webeditor [setup|whoami|resetpassword]
    permission: swagapi.admin

permissions:
  swagapi.admin:
    description: Access SwagAPI admin commands
    default: op
  swagapi.updates:
    description: Stage plugin updates via SwagAPI
    default: op
  swagapi.web:
    description: View web server status and registered modules via SwagAPI
    default: op
